function addDomElement(tag, attrs) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        if (k === "text") {
          el.textContent = attrs[k];
        } else {
          el.setAttribute(k, attrs[k]);
        }
      }
    }
    outputEl.appendChild(el);
    return el;
  }

const queue = [];
let isPlaying = false;



// Processes next item in queue
function processQueue() {
  if (queue.length === 0) {
    isPlaying = false;
    return;
  }

  isPlaying = true;
  const event = queue.shift();
  const key = event.key.toLowerCase();

  if (sounds[key]) {
    const soundData = sounds[key][Math.floor(Math.random() * sounds[key].length)];
    playSound(soundData.url);
    addDomElement("span", { text: soundData.ipa });
  } 
  else if (event.key === "Backspace") {
    if (outputEl.lastChild) outputEl.removeChild(outputEl.lastChild);
  } 
  else if (event.key === "Enter") {
    event.preventDefault();
    addDomElement("br");
  } 
  else if (event.key === "CapsLock") {
  }
  else if (event.key === "Shift") {
  }
  else if (event.key === "Meta") {
  }
  else if (event.key === "Alt") {
  }
  else if (event.key === "Control") {
  }
  else if (event.key === "!") {
    addDomElement("img", { 
      src: "https://t3.ftcdn.net/jpg/04/35/27/10/240_F_435271084_18q7j2SUfN0chZbzerN9fKm4zvx17Pvy.jpg" 
    });
  }
  else {
    addDomElement("span", { text: event.key });
  }

  
  setTimeout(processQueue, 400);
}

outputEl.addEventListener("click", e => {
  if (e.target.tagName === "SPAN") {
    const symbol = e.target.textContent;
    for (const key in sounds) {
      const match = sounds[key].find(s => s.ipa === symbol);
      if (match) {
        playSound(match.url);
        break;
      }
    }
  }
});

window.addEventListener("load", () => {
  const intro = document.getElementById("intro-message");
  setTimeout(() => {
    if (intro) intro.remove();
  }, 10500);
});


document.addEventListener("keydown", function(event) {
  if (event.key === "Backspace") {
    for ( let i = queue.length -1; i >=0; i--) {
      const key = queue[i].key.toLowerCase();
      if (sounds[key]) {
        queue.splice(i, 1);
        break;
      }
    }
  }
  queue.push(event);

  if (!isPlaying) processQueue();
});

// --- Question mark pop-up behavior ---
(function() {
  const popup = document.getElementById("question-popup");
  const questionButtons = document.querySelectorAll(".question-btn");

  function showPopup() {
    popup.classList.add("visible");
    clearTimeout(popup._fadeTimer);
    popup._fadeTimer = setTimeout(() => {
      popup.classList.remove("visible");
    }, 5000); // fade out after 5s
  }

  questionButtons.forEach(btn => btn.addEventListener("click", showPopup));
})();
